name: universal_barcode_scanner
description: >-
  Barcode and QR code scanner for Flutter, on Android, iOS, Linux, macOS, web
  and Windows, from one widget and one callback.
version: 1.3.0
homepage: https://www.comapps.be
repository: https://github.com/raphrmx/universal_barcode_scanner
issue_tracker: https://github.com/raphrmx/universal_barcode_scanner/issues

topics:
  - barcode
  - qrcode
  - scanner
  - camera

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.9.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_plugin_android_lifecycle: ^2.0.35
  web: ^1.1.1
  webview_all: ^1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  lint: ^2.10.0

flutter:
  assets:
    - packages/universal_barcode_scanner/assets/barcode.html
    - packages/universal_barcode_scanner/assets/html5-qrcode.min.js
  plugin:
    platforms:
      android:
        package: be.comapps.universal_barcode_scanner
        pluginClass: UniversalBarcodeScannerPlugin
      ios:
        pluginClass: SwiftUniversalBarcodeScannerPlugin
      macos:
        pluginClass: UniversalBarcodeScannerPlugin
