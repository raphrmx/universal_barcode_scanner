name: universal_barcode_scanner
description: >-
  Barcode and QR code scanner for Flutter, on Android, iOS, Linux, macOS, web
  and Windows, from one widget and one callback.
version: 2.0.1
homepage: https://packages.comapps.be/universal_barcode_scanner/
repository: https://github.com/raphrmx/universal_barcode_scanner
issue_tracker: https://github.com/raphrmx/universal_barcode_scanner/issues

topics:
  - barcode
  - qrcode
  - scanner
  - camera
  - reader

screenshots:
  - description: The native scanner reading a barcode on Android.
    path: screenshots/android_scan.webp
  - description: The code read, back in the app.
    path: screenshots/android_result.webp
  - description: The embedded view, the camera inside a tile of the app.
    path: screenshots/android_embedded.webp
  - description: The scanner reading a QR code with a webcam, in a browser.
    path: screenshots/web_scan.webp
  - description: The QR code read, back in the web app.
    path: screenshots/web_result.webp

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.9.0
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_plugin_android_lifecycle: ^2.0.35
  web: ^1.1.1
  webview_all: ^1.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  lint: ^2.10.0

flutter:
  assets:
    - packages/universal_barcode_scanner/assets/barcode.html
    - packages/universal_barcode_scanner/assets/html5-qrcode.min.js
  plugin:
    platforms:
      android:
        package: be.comapps.universal_barcode_scanner
        pluginClass: UniversalBarcodeScannerPlugin
      ios:
        pluginClass: UniversalBarcodeScannerPlugin
      macos:
        pluginClass: UniversalBarcodeScannerPlugin
