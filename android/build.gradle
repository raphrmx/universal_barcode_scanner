group 'be.comapps.universal_barcode_scanner'
version '1.0-SNAPSHOT'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.2'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    compileSdkVersion 34
    namespace "be.comapps.universal_barcode_scanner"
    defaultConfig {
        // CameraX and ML Kit both start at 21.
        minSdkVersion 21
        targetSdkVersion 34
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    lintOptions {
        disable 'InvalidPackage'
    }
}

// Every version here is held at the last release that still builds against
// compileSdk 34, so adding this plugin never forces the host app to move.
dependencies {
    implementation 'androidx.annotation:annotation-experimental:1.4.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.7'
    // The bundled model: no Play services needed and nothing downloaded on
    // first use.
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
}
