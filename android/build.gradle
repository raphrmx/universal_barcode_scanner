group 'be.comapps.universal_barcode_scanner'
version '1.0-SNAPSHOT'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.2'
        // Only used when the app itself has no Kotlin plugin on its classpath:
        // an app that has one imposes its own version.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

// AGP 9 compiles Kotlin by itself, and fails on a module that also applies the
// Kotlin Android plugin; earlier AGP versions need that plugin, and a Flutter
// older than 3.47 does not apply it for us. It is applied through the plugin
// manager rather than an `apply plugin:` line, because Flutter decides whether
// a plugin applies it by reading this file, and would warn about a line that
// never runs under AGP 9.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlin = agpMajor >= 9 && providers.gradleProperty('android.builtInKotlin')
        .map { it.toBoolean() }
        .getOrElse(true)
if (!builtInKotlin) {
    pluginManager.apply('org.jetbrains.kotlin.android')
}

android {
    namespace "be.comapps.universal_barcode_scanner"
    // Not a choice: flutter_plugin_android_lifecycle, a dependency, is built
    // against 36, and AGP 9 refuses a module that compiles against less than
    // what its dependencies need. Every app already has to compile against 36.
    compileSdk 36
    defaultConfig {
        // CameraX and ML Kit both start at 21.
        minSdk 21
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }
    lint {
        // RTL support is the app's to declare: this manifest merges into its.
        disable 'InvalidPackage', 'RtlEnabled'
    }
}

// Kotlin has to target the same bytecode as Java, or the build refuses the
// mismatch. Built-in Kotlin takes it from compileOptions by itself.
pluginManager.withPlugin('org.jetbrains.kotlin.android') {
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)
    }
}

// Every version here is held at the last release that still builds against
// compileSdk 34, so none of them raises the floor above what the Flutter
// dependencies already set.
dependencies {
    implementation 'androidx.annotation:annotation-experimental:1.4.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.7'
    // The bundled model: no Play services needed and nothing downloaded on
    // first use.
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    testImplementation 'junit:junit:4.13.2'
}
