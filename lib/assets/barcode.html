<!DOCTYPE html>
<html lang="en">
<head>
  <title>Scanner</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      /* Any rounding leftover must be cropped, never scrolled: a webview host
         has no business showing scrollbars over a camera. */
      overflow: hidden;
    }
    /* A column: justify-content centres the stage in the window. */
    body {
      background: var(--ubs-background, #000);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    /* The camera, sized by the script from the video's own ratio, and the
       scan box over it. The box's shadow shades the rest of the stage, which
       clips it. */
    #stage {
      position: relative;
      flex: none;
      margin: 0 auto;
      overflow: hidden;
    }
    /* Flipped here rather than by the host, so only the camera turns: the
       scan box and the messages stay the right way round. */
    #stage video {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      transform: scale(var(--ubs-flip-x, 1), var(--ubs-flip-y, 1));
      /* Hidden until its first frame, so the camera arrives rather than a
         black box standing in for it. */
      opacity: 0;
    }
    #stage video.live { opacity: 1; }
    /* A flip turns the picture over through its middle, as a card does. */
    .ubs-animate #stage video {
      transition: opacity 0.4s ease-out, transform 0.35s ease-in-out;
    }
    @media (prefers-reduced-motion: reduce) {
      .ubs-animate #stage video { transition: none; }
    }
    #box {
      display: none;
      position: absolute;
      box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.48);
    }
    #box.shown { display: block; }
    /* Four white corners, drawn as borders on four small squares. */
    #box i {
      position: absolute;
      width: 24px;
      height: 24px;
      border: 0 solid #fff;
    }
    #box i:nth-child(1) { left: -2px; top: -2px; border-width: 4px 0 0 4px; }
    #box i:nth-child(2) { right: -2px; top: -2px; border-width: 4px 4px 0 0; }
    #box i:nth-child(3) { left: -2px; bottom: -2px; border-width: 0 0 4px 4px; }
    #box i:nth-child(4) { right: -2px; bottom: -2px; border-width: 0 4px 4px 0; }

    /* The sweeping line, inside the box. */
    #ubs-scan-line {
      position: absolute;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--ubs-line-color, #ff6666);
      box-shadow: 0 0 8px 1px var(--ubs-line-color, #ff6666);
      opacity: 0.9;
      animation: ubs-sweep 2s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes ubs-sweep {
      0%   { top: 0; }
      50%  { top: calc(100% - 2px); }
      100% { top: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      #ubs-scan-line { animation: none; top: calc(50% - 1px); }
    }

    /* Shown when the camera never starts. Without it the page is a black
       rectangle and the reason is only in the console. */
    #ubs-message {
      display: none;
      max-width: 34ch;
      margin: 0 auto;
      padding: 0 24px;
      color: #e8e8ea;
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    #ubs-message.shown { display: block; }
    #ubs-message b { display: block; margin-bottom: 6px; font-size: 16px; }
    #ubs-message span { color: #9aa0a8; }

    /* Embedded in a Flutter view: the camera fills the view, cropped rather
       than letterboxed, as the native views do, and Flutter draws the scan
       window over it. */
    .ubs-embedded body { display: block; }
    .ubs-embedded #stage {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      margin: 0;
    }
    .ubs-embedded #stage video { object-fit: cover; }
    .ubs-embedded #box { display: none; }
    .ubs-embedded #ubs-message.shown {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      max-width: none;
      padding: 0 16px;
      box-sizing: border-box;
      font-size: 13px;
    }
  </style>
</head>
<body>
<div id="stage">
  <video id="video" muted playsinline></video>
  <div id="box"><i></i><i></i><i></i><i></i><div id="ubs-scan-line"></div></div>
</div>
<p id="ubs-message"></p>
<script>
// Scoped rather than global: a top-level `var closed` is `window.closed`, a
// read-only property, and assigning it silently did nothing.
(function () {
  'use strict';

  // Desktop hosts register a JavaScript channel under this name; on the web
  // the page answers its parent.
  var CHANNEL = 'UniversalBarcodeScanner';
  var message = document.getElementById('ubs-message');
  var stage = document.getElementById('stage');
  var video = document.getElementById('video');
  var box = document.getElementById('box');

  // Smallest scan box, in CSS pixels.
  var MIN_BOX = 60;
  // Widest the camera is shown, in CSS pixels, outside an embedded view.
  var MAX_SHOWN = 640;
  // A code held in front of the camera is read on every frame. It is reported
  // once, and again only after it has been out of sight this long.
  var SAME_CODE_GAP_MS = 1000;
  // Shortest time between two frames handed to the decoder. A frame is only
  // taken once the previous one is read, so a slow machine reads fewer.
  var FRAME_MS = 66;
  // How long a worker gets to load the decoder before the page does it
  // itself.
  var WORKER_TIMEOUT_MS = 8000;
  // Frames in a row a worker may fail to read before the page stops
  // trusting it and reads by itself.
  var WORKER_FAILURES = 5;

  // Same lists as the native scanners, in BarcodeDetector's names. Null is
  // every format the decoder knows.
  var FORMATS = {
    all: null,
    qr: ['qr_code'],
    barcode: ['codabar', 'code_39', 'code_93', 'code_128', 'ean_13', 'ean_8',
      'itf', 'pdf417', 'upc_a', 'upc_e']
  };

  // What the page writes when the camera does not start: each failure's title
  // and what to do about it. English until the host hands others.
  var LABELS = {
    blocked: ['Camera blocked', 'The page needs permission to use the camera. '
      + 'Allow it in the address bar, then reload.'],
    missing: ['No camera found', 'This device has no camera the browser can '
      + 'open. Try it on a phone.'],
    busy: ['Camera busy', 'Another application is using it. Close that one '
      + 'and reload.'],
    insecure: ['Not a secure origin', 'A browser only opens the camera over '
      + 'HTTPS or on localhost.'],
    failed: ['The camera did not start', 'No reason was given.'],
    decoder: ['The scanner did not load', 'The decoder could not be started.']
  };

  // Nothing runs until configure: the desktop hosts call it once the page is
  // up, the web host passes the same settings in the query string.
  var settings = {
    continuous: false,
    delay: 0,
    facing: 'environment',
    formats: 'all',
    window: 'square',
    host: 'web',
    // Embedded in a Flutter view, which draws the scan window and passes its
    // size, in CSS pixels of the view.
    embedded: false,
    windowWidth: 0,
    windowHeight: 0,
    // The camera shown mirrored left to right, and upside down.
    flipX: false,
    flipY: false,
    // Whether the camera fades in and turns over when flipped.
    animate: true,
    labels: LABELS
  };
  var stopped = true;
  var delivered = false;
  // The zoom the camera shows, 1 for none.
  var zoomLevel = 1;
  // An embedded view pauses rather than stops: on the first code when it is
  // not continuous, and when the app asks.
  var paused = false;
  var torchOn = false;
  // Every code in sight, by value: when it was last read and whether it has
  // been reported since it came into view.
  var sightings = {};
  var lastEmit = null;

  // The camera as it runs, and the facing it was opened with.
  var stream = null;
  var streamFacing = null;
  // Starting and stopping the camera are asynchronous and must not overlap.
  var queue = Promise.resolve();
  // Bumped on every stop, so the frame loop of a stopped camera winds down.
  var generation = 0;
  // The generation a frame loop runs for, so there is never a second one.
  var reading = -1;

  // The web host passes the colour in the query string, the desktop hosts
  // call this once the page is up.
  function setScanLineColor(css) {
    if (css) {
      document.documentElement.style.setProperty('--ubs-line-color', css);
    }
  }

  // Same for the colour behind the camera.
  function setBackgroundColor(css) {
    if (css) {
      document.documentElement.style.setProperty('--ubs-background', css);
    }
  }

  function applyFlip() {
    var style = document.documentElement.style;
    style.setProperty('--ubs-flip-x', settings.flipX ? '-1' : '1');
    style.setProperty('--ubs-flip-y', settings.flipY ? '-1' : '1');
  }

  /// What went wrong, in words, rather than a black rectangle.
  function showMessage(error) {
    if (!message) {
      return;
    }
    var name = (error && (error.name || error.code)) || '';
    var text = String((error && error.message) || error || '');
    var title;
    var detail;
    // The wire names of ScannerErrorCode, for an embedded view's onError.
    var code = 'camera_unavailable';

    // The host words each case for where it runs: a desktop webview has no
    // address bar and nothing to reload.
    var labels = settings.labels;
    var words;
    if (name === 'DecoderError') {
      code = 'unknown';
      words = labels.decoder;
    } else if (name === 'NotAllowedError' || /permission|denied/i.test(text)) {
      code = 'camera_permission_denied';
      words = labels.blocked;
    } else if (name === 'NotFoundError' || name === 'OverconstrainedError'
        || /no camera|not found/i.test(text)) {
      words = labels.missing;
    } else if (name === 'NotReadableError' || /in use|busy/i.test(text)) {
      words = labels.busy;
    } else if (settings.host !== 'desktop' && !window.isSecureContext) {
      words = labels.insecure;
    } else {
      code = 'unknown';
      // What the browser said, when it said something.
      words = [labels.failed[0], text || labels.failed[1]];
    }
    title = words[0];
    detail = words[1];
    if (settings.embedded) {
      post({ error: { code: code, message: text || name || title } });
    }

    message.innerHTML = '';
    var strong = document.createElement('b');
    strong.textContent = title;
    var span = document.createElement('span');
    span.textContent = detail;
    message.appendChild(strong);
    message.appendChild(span);
    message.className = 'shown';
    box.className = '';
  }

  function hideMessage() {
    if (message) {
      message.className = '';
    }
  }

  // ---------------------------------------------------------------------
  // Decoding.

  // Loads a script next to this page, once.
  var scripts = {};
  function loadScript(src) {
    if (!scripts[src]) {
      scripts[src] = new Promise(function (resolve, reject) {
        var tag = document.createElement('script');
        tag.src = src;
        tag.onload = resolve;
        tag.onerror = function () {
          reject(new Error('Could not load ' + src + '.'));
        };
        document.head.appendChild(tag);
      });
    }
    return scripts[src];
  }

  function closeFrame(frame) {
    if (frame && typeof frame.close === 'function') {
      frame.close();
    }
  }

  // Reads frames with [detector] on this page's thread: the platform's own,
  // which does its work elsewhere anyway, or the bundled one where no worker
  // can run.
  function pageReader(detector) {
    return {
      read: function (frame) {
        return window.UbsDecoder.read(detector, frame).then(function (codes) {
          closeFrame(frame);
          return codes;
        }, function (error) {
          closeFrame(frame);
          throw error;
        });
      }
    };
  }

  // The bundled reader on this page's thread, its scripts loaded only then.
  function pageDecoder(formats) {
    return loadScript('decoder.js').then(function () {
      return window.UbsDecoder.bundled(formats, function () {
        return loadScript('barcode-detector.js').then(function () {
          return loadScript('zxing-reader-wasm.js');
        });
      });
    }).then(pageReader);
  }

  // The worker of the page, kept for as long as it works: the reader it
  // compiled serves every list of formats, so a change costs one message.
  // Once one has failed, the page reads by itself until it is reloaded.
  var worker = null;
  var workerFailed = false;

  // Starts a worker, or answers null where none can run: a webview on
  // file://, or a browser without them.
  function startWorker() {
    if (workerFailed || typeof Worker === 'undefined'
      || !/^https?:$/.test(window.location.protocol)) {
      return null;
    }
    var instance;
    try {
      instance = new Worker('decoder.js');
    } catch (error) {
      workerFailed = true;
      return null;
    }
    var handle = {
      // Called when a worker that had answered stops working, for the page
      // to take over.
      onLost: function () {},
      use: use
    };
    var frames = {};
    var requests = {};
    var next = 0;
    var answered = false;
    var dead = false;
    var failures = 0;

    function fail(error) {
      if (dead) {
        return;
      }
      dead = true;
      workerFailed = true;
      if (worker === handle) {
        worker = null;
      }
      instance.terminate();
      var id;
      for (id in frames) {
        frames[id].reject(error);
      }
      // A request left waiting hands over to the page's reader through its
      // own rejection; only without one is the loss said separately.
      var waiting = false;
      for (id in requests) {
        waiting = true;
        clearTimeout(requests[id].timer);
        requests[id].reject(error);
      }
      frames = {};
      requests = {};
      if (answered && !waiting) {
        handle.onLost();
      }
    }

    instance.onerror = function (event) {
      event.preventDefault();
      fail(new Error(event.message || 'The decoder worker failed.'));
    };
    instance.onmessage = function (event) {
      var data = event.data || {};
      if (data.type === 'formats' && requests[data.seq]) {
        var request = requests[data.seq];
        delete requests[data.seq];
        clearTimeout(request.timer);
        if (data.error) {
          request.reject(new Error(data.error));
        } else {
          answered = true;
          request.resolve();
        }
      } else if (data.type === 'codes' && frames[data.id]) {
        var frame = frames[data.id];
        delete frames[data.id];
        if (!data.error) {
          failures = 0;
          frame.resolve(data.codes);
          return;
        }
        // A frame the reader could not take is that frame lost; only a run
        // of them says the worker no longer reads.
        frame.reject(new Error(data.error));
        if (++failures >= WORKER_FAILURES) {
          fail(new Error(data.error));
        }
      }
    };

    function read(frame) {
      if (dead) {
        closeFrame(frame);
        return Promise.reject(new Error('The decoder worker is gone.'));
      }
      return new Promise(function (resolve, reject) {
        var id = ++next;
        frames[id] = { resolve: resolve, reject: reject };
        var transfer = typeof frame.close === 'function'
          ? [frame] : [frame.data.buffer];
        instance.postMessage({ type: 'frame', id: id, frame: frame }, transfer);
      });
    }

    // A reader for [formats], once the worker has a detector for them.
    // Rejects when it cannot build one, or does not answer in time.
    function use(formats) {
      if (dead) {
        return Promise.reject(new Error('The decoder worker is gone.'));
      }
      return new Promise(function (resolve, reject) {
        var seq = ++next;
        requests[seq] = {
          resolve: resolve,
          reject: reject,
          timer: setTimeout(function () {
            fail(new Error('The decoder worker did not answer.'));
          }, WORKER_TIMEOUT_MS)
        };
        instance.postMessage({ type: 'formats', seq: seq, formats: formats });
      }).then(function () {
        return { read: read };
      });
    }

    return handle;
  }

  // The decoder for the formats asked for, built again when they change, and
  // whether it could not be built at all, which holds until the next
  // configure rather than being retried on every frame.
  var decoder = null;
  var decoderFormats = null;
  var decoderBroken = false;

  // The platform's own detector where it reads every format asked for: it
  // already works off this thread. Otherwise the bundled one, in a worker
  // where one can run, which matters most on the web, where this thread is
  // the app's, and on this page where none can.
  function decoderFor(key) {
    if (decoder && decoderFormats === key) {
      return decoder;
    }
    var formats = FORMATS[key];
    decoderFormats = key;
    var built = loadScript('decoder.js').then(function () {
      return window.UbsDecoder.native(formats);
    }).then(function (detector) {
      if (detector) {
        return pageReader(detector);
      }
      var shared = worker || (worker = startWorker());
      if (!shared) {
        return pageDecoder(formats);
      }
      shared.onLost = function () {
        if (decoder === built) {
          decoder = pageDecoder(formats);
          watch(decoder);
        }
      };
      return shared.use(formats).catch(function () {
        return pageDecoder(formats);
      });
    });
    decoder = built;
    watch(built);
    return built;
  }

  function watch(pending) {
    pending.catch(function (error) {
      if (decoder !== pending) {
        return;
      }
      decoderBroken = true;
      showMessage({
        name: 'DecoderError',
        message: String((error && error.message) || error)
      });
    });
  }

  // The part of the frame to decode, in the video's own pixels: the scan box
  // shown, or the window Flutter draws over an embedded view, or the whole
  // frame when there is none.
  function cropRect() {
    var vw = video.videoWidth;
    var vh = video.videoHeight;
    var whole = { x: 0, y: 0, width: vw, height: vh };
    var rect;
    if (settings.window === 'none') {
      return whole;
    } else if (settings.embedded) {
      if (!settings.windowWidth || !settings.windowHeight) {
        return whole;
      }
      // Cover: the frame is scaled to fill the view and centred in it, as
      // the window is.
      var scale = Math.max(document.body.clientWidth / vw,
        document.body.clientHeight / vh) || 1;
      var w = settings.windowWidth / scale;
      var h = settings.windowHeight / scale;
      rect = { x: (vw - w) / 2, y: (vh - h) / 2, width: w, height: h };
    } else {
      if (!box.offsetWidth) {
        return whole;
      }
      var shown = stage.clientWidth / vw || 1;
      rect = {
        x: box.offsetLeft / shown,
        y: box.offsetTop / shown,
        width: box.offsetWidth / shown,
        height: box.offsetHeight / shown
      };
    }
    // What is shown flipped sits at the other side of the unflipped frame.
    if (settings.flipX) {
      rect.x = vw - rect.x - rect.width;
    }
    if (settings.flipY) {
      rect.y = vh - rect.y - rect.height;
    }
    var x = Math.max(0, Math.floor(rect.x));
    var y = Math.max(0, Math.floor(rect.y));
    return {
      x: x,
      y: y,
      width: Math.max(1, Math.min(vw - x, Math.ceil(rect.width))),
      height: Math.max(1, Math.min(vh - y, Math.ceil(rect.height)))
    };
  }

  // One frame, cropped: an ImageBitmap where the browser can make one, which
  // costs this thread next to nothing, pixels read off a canvas otherwise.
  var canvas = null;
  function grab() {
    var rect = cropRect();
    if (typeof createImageBitmap === 'function') {
      return createImageBitmap(video, rect.x, rect.y, rect.width, rect.height);
    }
    canvas = canvas || document.createElement('canvas');
    // Setting a size, even the same one, drops the canvas's pixels.
    if (canvas.width !== rect.width || canvas.height !== rect.height) {
      canvas.width = rect.width;
      canvas.height = rect.height;
    }
    var context = canvas.getContext('2d', { willReadFrequently: true });
    context.drawImage(video, rect.x, rect.y, rect.width, rect.height,
      0, 0, rect.width, rect.height);
    return Promise.resolve(context.getImageData(0, 0, rect.width, rect.height));
  }

  // Starts handing frames to the decoder, unless a loop already does for
  // this camera.
  function startReading() {
    if (reading === generation) {
      return;
    }
    reading = generation;
    readFrames(generation);
  }

  // Hands frames to the decoder for as long as the camera of [run] runs.
  function readFrames(run) {
    if (run !== generation || stopped || delivered || decoderBroken) {
      if (reading === run) {
        reading = -1;
      }
      return;
    }
    var began = Date.now();
    var again = function () {
      setTimeout(function () {
        readFrames(run);
      }, Math.max(0, FRAME_MS - (Date.now() - began)));
    };
    if (paused || video.readyState < 2 || !video.videoWidth) {
      again();
      return;
    }
    decoderFor(settings.formats).then(function (ready) {
      return grab().then(function (frame) {
        return ready.read(frame);
      });
    }).then(function (codes) {
      if (run !== generation) {
        return;
      }
      for (var i = 0; i < codes.length; i++) {
        onDecoded(codes[i].text, codes[i].format);
      }
    }, function () {
      /* a frame lost, or the decoder gone: the next one tries again */
    }).then(again);
  }

  // ---------------------------------------------------------------------
  // The camera.

  // Runs one camera operation after the previous one has settled.
  function enqueue(task) {
    queue = queue.then(task).catch(function () {
      /* each task reports its own failure */
    });
  }

  function stopCamera() {
    generation++;
    // Said to the host, whose buttons show them.
    if (torchOn) {
      post({ torch: false });
    }
    if (zoomLevel !== 1) {
      post({ zoom: 1 });
    }
    zoomLevel = 1;
    if (stream) {
      stream.getTracks().forEach(function (track) { track.stop(); });
    }
    stream = null;
    streamFacing = null;
    video.classList.remove('live');
    video.srcObject = null;
    torchOn = false;
    fit();
    return Promise.resolve();
  }

  function startCamera() {
    if (stopped || delivered) {
      return Promise.resolve();
    }
    // Already running this way: kept, rather than asked for again.
    if (stream && streamFacing === settings.facing) {
      fit();
      startReading();
      return Promise.resolve();
    }
    stopCamera();
    // Loaded while the camera opens.
    decoderFor(settings.formats);
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showMessage({
        name: 'NotSupportedError',
        message: 'This page cannot reach a camera.'
      });
      return Promise.resolve();
    }
    // Asked for explicitly: a browser hands out 640x480 when nothing is said,
    // about two pixels per bar for a barcode held at arm's length, where the
    // decoder gives up on the slightest blur. 1280x720 doubles that for a few
    // milliseconds more per frame; 1080p would cost twice as much again.
    // Continuous focus, where the camera has it, keeps a close code sharp.
    var facing = settings.facing;
    return navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: facing,
        width: { ideal: 1280 },
        height: { ideal: 720 },
        advanced: [{ focusMode: 'continuous' }]
      }
    }).then(function (opened) {
      // Stopped or answered while the camera was opening.
      if (stopped || delivered) {
        opened.getTracks().forEach(function (track) { track.stop(); });
        return;
      }
      stream = opened;
      streamFacing = facing;
      video.srcObject = opened;
      return video.play().catch(function () {
        /* muted and inline, so allowed to play; frames arrive regardless */
      }).then(function () {
        if (!decoderBroken) {
          hideMessage();
        }
        fit();
        startReading();
      });
    }, showMessage);
  }

  // ---------------------------------------------------------------------
  // Layout.

  // Sizes the stage to the video's ratio, as large as the window allows up
  // to MAX_SHOWN wide, and places the scan box on it. Cheap, and all a resize
  // needs: the frame is cropped from the box on every read, so the camera
  // never restarts for it.
  function fit() {
    if (settings.embedded) {
      stage.style.width = '';
      stage.style.height = '';
      return;
    }
    // No camera, no stage: a message alone sits in the middle.
    if (!stream) {
      stage.style.width = '0';
      stage.style.height = '0';
      box.className = '';
      return;
    }
    var vw = video.videoWidth || 16;
    var vh = video.videoHeight || 9;
    var body = document.body;
    var width = Math.min(body.clientWidth, MAX_SHOWN,
      body.clientHeight * vw / vh);
    var height = width * vh / vw;
    stage.style.width = Math.round(width) + 'px';
    stage.style.height = Math.round(height) + 'px';

    if (settings.window === 'none') {
      box.className = '';
      return;
    }
    var boxWidth;
    var boxHeight;
    if (settings.window === 'wide') {
      boxWidth = Math.max(MIN_BOX, Math.floor(width * 0.85));
      boxHeight = Math.max(MIN_BOX, Math.min(Math.floor(boxWidth * 0.45),
        Math.floor(height * 0.85)));
    } else {
      var smallest = Math.min(width, height);
      boxWidth = boxHeight = Math.max(MIN_BOX, Math.floor(smallest * 0.7));
    }
    // A size asked for, as the other platforms take it.
    if (settings.windowWidth > 0 && settings.windowHeight > 0) {
      boxWidth = Math.max(MIN_BOX, settings.windowWidth);
      boxHeight = Math.max(MIN_BOX, settings.windowHeight);
    }
    boxWidth = Math.min(boxWidth, width);
    boxHeight = Math.min(boxHeight, height);
    box.style.width = boxWidth + 'px';
    box.style.height = boxHeight + 'px';
    box.style.left = Math.round((width - boxWidth) / 2) + 'px';
    box.style.top = Math.round((height - boxHeight) / 2) + 'px';
    box.className = 'shown';
  }

  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(fit).observe(document.body);
  }
  window.addEventListener('resize', fit);
  // The video's size is known once it has metadata, and changes when a
  // phone turns.
  video.addEventListener('loadedmetadata', fit);
  // Shown, faded in where it animates, once a frame is there to show.
  video.addEventListener('playing', function () {
    if (stream) {
      video.classList.add('live');
    }
  });
  video.addEventListener('resize', fit);

  // ---------------------------------------------------------------------
  // What the hosts call.

  // Sets the page up and starts the camera. The desktop hosts call it every
  // time they show the page, which they keep loaded between two scans, so it
  // also lifts whatever the previous scan left latched.
  function configure(options) {
    options = options || {};
    setScanLineColor(options.line);
    setBackgroundColor(options.background);
    settings.continuous = options.continuous === true
      || options.continuous === '1';
    settings.delay = Math.max(0, parseInt(options.delay, 10) || 0);
    settings.facing = options.facing === 'user' ? 'user' : 'environment';
    settings.formats = FORMATS.hasOwnProperty(options.formats)
      ? options.formats : 'all';
    settings.window = options.window === 'wide' || options.window === 'none'
      ? options.window : 'square';
    settings.host = options.host === 'desktop' ? 'desktop' : 'web';
    // Set or cleared every time: a kept desktop page may have been a view
    // before and a full page now, or the other way round.
    settings.embedded = options.embedded === true || options.embedded === '1';
    settings.windowWidth = Math.max(0, parseInt(options.windowWidth, 10) || 0);
    settings.windowHeight = Math.max(0, parseInt(options.windowHeight, 10) || 0);
    settings.flipX = options.flipX === true || options.flipX === '1';
    settings.flipY = options.flipY === true || options.flipY === '1';
    settings.labels = readLabels(options.labels);
    // Anything but an explicit no animates, as the Dart side defaults to.
    settings.animate = !(options.animate === false || options.animate === '0');
    document.documentElement.classList.toggle('ubs-animate', settings.animate);
    applyFlip();
    document.documentElement.classList.toggle('ubs-embedded', settings.embedded);

    stopped = false;
    delivered = false;
    paused = false;
    sightings = {};
    lastEmit = null;
    if (decoderBroken) {
      decoderBroken = false;
      decoder = null;
    }
    hideMessage();
    fit();
    enqueue(startCamera);
  }

  // The host's words over the English ones, each failure it names.
  function readLabels(given) {
    if (typeof given === 'string') {
      try {
        given = JSON.parse(given);
      } catch (error) {
        given = null;
      }
    }
    var labels = {};
    for (var key in LABELS) {
      var words = given && given[key];
      labels[key] = Array.isArray(words) && words.length === 2
        ? [String(words[0]), String(words[1])] : LABELS[key];
    }
    return labels;
  }

  // The other camera, asked for while the scanner runs: the one running is
  // let go and the other opened in its place.
  function setFacing(facing) {
    var wanted = facing === 'user' ? 'user' : 'environment';
    if (wanted === settings.facing) {
      return;
    }
    settings.facing = wanted;
    if (!stopped && !delivered) {
      enqueue(startCamera);
    }
  }

  // An embedded view's scan window, when its layout changes it. Read on the
  // next frame: nothing restarts.
  function setWindow(width, height) {
    settings.windowWidth = Math.max(0, Math.round(width) || 0);
    settings.windowHeight = Math.max(0, Math.round(height) || 0);
  }

  // An embedded view flipped while it runs. Only the picture turns: the
  // camera keeps going.
  function setFlip(x, y) {
    settings.flipX = x === true || x === '1';
    settings.flipY = y === true || y === '1';
    applyFlip();
  }

  // What an embedded view's controller asks for.
  function pauseScanning() {
    paused = true;
  }

  // Every code in sight counts as new again, as on the native views.
  function resumeScanning() {
    paused = false;
    sightings = {};
    lastEmit = null;
  }

  // Answers with the zoom applied: clamped to what the camera can do, and 1
  // where it cannot zoom at all, as on most webcams.
  function setZoom(wanted) {
    var track = stream && stream.getVideoTracks()[0];
    var capabilities = track && typeof track.getCapabilities === 'function'
      ? track.getCapabilities() : {};
    var range = capabilities.zoom;
    if (!range || typeof range.max !== 'number' || range.max <= 1) {
      post({ zoom: zoomLevel });
      return;
    }
    var value = Math.min(range.max, Math.max(range.min || 1, Number(wanted) || 1));
    track.applyConstraints({ advanced: [{ zoom: value }] }).then(
      function () {
        zoomLevel = value;
        post({ zoom: value });
      },
      function () { post({ zoom: zoomLevel }); }
    );
  }

  // Answers with the torch's state, which stays off where the camera has no
  // torch the browser lets a page drive, as on most webcams.
  function toggleTorch() {
    var wanted = !torchOn;
    var answer = function (on) {
      torchOn = on;
      post({ torch: on });
    };
    var track = stream && stream.getVideoTracks()[0];
    var capabilities = track && typeof track.getCapabilities === 'function'
      ? track.getCapabilities() : {};
    if (!capabilities.torch) {
      answer(false);
      return;
    }
    track.applyConstraints({ advanced: [{ torch: wanted }] }).then(
      function () { answer(wanted); },
      function () { answer(torchOn); }
    );
  }

  // Called by the desktop hosts before the scanner goes away, to release the
  // camera.
  function stopScanner() {
    stopped = true;
    enqueue(stopCamera);
  }

  function hasChannel() {
    return typeof window[CHANNEL] !== 'undefined'
      && typeof window[CHANNEL].postMessage === 'function';
  }

  // Whether a code read on this frame is worth reporting. Each code is
  // followed on its own, so two codes in sight are each reported once rather
  // than alternately. A code the delay held back stays unreported and goes
  // out as soon as the delay allows, if it is still in sight.
  function accept(text, now) {
    for (var key in sightings) {
      if (now - sightings[key].seen >= SAME_CODE_GAP_MS) {
        delete sightings[key];
      }
    }
    var sighting = sightings[text];
    if (!sighting) {
      sighting = sightings[text] = { seen: now, reported: false };
    }
    sighting.seen = now;
    if (sighting.reported) {
      return false;
    }
    if (lastEmit !== null && now - lastEmit < settings.delay) {
      return false;
    }
    sighting.reported = true;
    lastEmit = now;
    return true;
  }

  function onDecoded(text, format) {
    if (stopped || delivered || paused || !text || !accept(text, Date.now())) {
      return;
    }
    if (!settings.continuous) {
      if (settings.embedded) {
        // The view stays on screen: it waits for resumeScanning.
        paused = true;
      } else {
        delivered = true;
        enqueue(stopCamera);
      }
    }
    post({ code: text, format: format || 'unknown' });
  }

  // JSON rather than the bare code, so that no code reads as a command.
  function post(data) {
    var text = JSON.stringify(data);
    if (hasChannel()) {
      window[CHANNEL].postMessage(text);
      return;
    }
    // Naming the origin keeps the message from reaching a parent on another
    // one.
    window.parent.postMessage(text, window.location.origin);
  }

  // The page holds the keyboard, so Escape has to be caught here to reach
  // the host.
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') {
      post({ close: true });
    }
  });

  // On the web, the host reaches the page through its parent: only that
  // window, on this origin, and only these calls, each with its arguments in
  // order, as the desktop hosts call them.
  var CALLS = {
    pauseScanning: pauseScanning,
    resumeScanning: resumeScanning,
    toggleTorch: toggleTorch,
    setWindow: setWindow,
    setFlip: setFlip,
    setFacing: setFacing,
    setZoom: setZoom
  };
  window.addEventListener('message', function (event) {
    if (event.source !== window.parent || event.origin !== window.location.origin) {
      return;
    }
    var data;
    try {
      data = JSON.parse(event.data);
    } catch (error) {
      return;
    }
    if (data && typeof data.call === 'string' && CALLS.hasOwnProperty(data.call)) {
      CALLS[data.call].apply(null, Array.isArray(data.args) ? data.args : []);
    }
  });

  var query = new URLSearchParams(window.location.search);
  if (query.has('start')) {
    configure({
      host: query.get('host'),
      line: query.get('line'),
      background: query.get('background'),
      continuous: query.get('continuous'),
      delay: query.get('delay'),
      facing: query.get('facing'),
      formats: query.get('formats'),
      window: query.get('window'),
      embedded: query.get('embedded'),
      windowWidth: query.get('windowWidth'),
      windowHeight: query.get('windowHeight'),
      flipX: query.get('flipX'),
      flipY: query.get('flipY'),
      animate: query.get('animate'),
      labels: query.get('labels')
    });
    // The host holds its calls back until the page listens.
    post({ ready: true });
  }

  // What the hosts call from outside.
  window.configure = configure;
  window.stopScanner = stopScanner;
  window.setWindow = setWindow;
  window.setFlip = setFlip;
  window.setFacing = setFacing;
  window.setZoom = setZoom;
  window.pauseScanning = pauseScanning;
  window.resumeScanning = resumeScanning;
  window.toggleTorch = toggleTorch;
})();
</script>
</body>
</html>
