<!DOCTYPE html>
<html lang="en">
<head>
  <title>Scanner</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* In order to place the tracking correctly */
    canvas.drawing, canvas.drawingBuffer {
      position: absolute;
      left: 0;
      top: 0;
    }
    html, body {
      height: 100%;
      margin: 0;
      /* Any rounding leftover must be cropped, never scrolled: a webview host
         has no business showing scrollbars over a camera. */
      overflow: hidden;
    }
    /* The framing happens here rather than in the host, because the library
       reads `#reader.clientWidth` to size the video and every piece of its
       geometry follows from it. A host that sized the view to one box while
       the page laid out for another got the whole overlay stretched. */
    body {
      background: #000;
    }
    /* Capped and centred with margins rather than flex: a flex item collapses
       to zero width while it is still empty, and the library would measure
       that zero at start and size the video to nothing. A block always takes
       the width available to it. */
    #reader {
      max-width: 640px;
      margin: 0 auto;
    }

    /* The sweeping line. It is appended inside #qr-shaded-region, whose
       borders draw the shading, so its content box is exactly the scan square
       and the line needs no geometry of its own. */
    #ubs-scan-line {
      position: absolute;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--ubs-line-color, #ff6666);
      box-shadow: 0 0 8px 1px var(--ubs-line-color, #ff6666);
      opacity: 0.9;
      animation: ubs-sweep 2s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes ubs-sweep {
      0%   { top: 0; }
      50%  { top: calc(100% - 2px); }
      100% { top: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      #ubs-scan-line { animation: none; top: calc(50% - 1px); }
    }
  </style>
  <script src="html5-qrcode.min.js"></script>
</head>
<body>
<div id="reader"></div>
<script>
  // refer doc here https://github.com/mebjas/html5-qrcode

  // Desktop hosts register a JavaScript channel under this name. On the web
  // the page runs in an iframe instead and answers its parent.
  var CHANNEL = 'UniversalBarcodeScanner';
  var SHADED_REGION_ID = 'qr-shaded-region';
  // The library refuses anything under 50px; staying above it keeps the box
  // usable on the smallest viewports.
  var MIN_QR_BOX = 60;

  var reader = document.getElementById('reader');
  var scanner = new Html5Qrcode('reader');
  var delivered = false;
  var closed = false;
  var busy = false;
  var lastWidth = 0;
  var resizeTimer = null;

  // No aspectRatio on purpose: forcing one makes the library size the video to
  // a shape the host box does not have, which overflows and brings up
  // scrollbars. Left out, it follows the camera's own ratio.
  var config = {
    fps: 30,
    // Derived from the viewfinder rather than fixed. The library drops the
    // shaded region entirely as soon as the box is taller than the video, and
    // a fixed 280 is taller than the video on a narrow screen, which left the
    // scanner with no square and no line at all.
    qrbox: function (viewfinderWidth, viewfinderHeight) {
      var smallest = Math.min(viewfinderWidth, viewfinderHeight);
      var size = Math.max(MIN_QR_BOX, Math.floor(smallest * 0.7));
      if (size > smallest) {
        size = smallest;
      }
      return { width: size, height: size };
    }
  };

  // The web host passes the colour in the query string, the desktop hosts call
  // setScanLineColor once the page is up. Either way it lands on the same
  // custom property.
  function setScanLineColor(css) {
    if (css) {
      document.documentElement.style.setProperty('--ubs-line-color', css);
    }
  }

  // Hangs the sweeping line inside the library's own scan region, so it tracks
  // the box even when the library shrinks it to fit the video.
  function addScanLine() {
    var region = document.getElementById(SHADED_REGION_ID);
    if (!region) {
      return false;
    }
    if (document.getElementById('ubs-scan-line')) {
      return true;
    }
    var line = document.createElement('div');
    line.id = 'ubs-scan-line';
    region.appendChild(line);
    return true;
  }

  // The region is created while starting, but not always before the promise
  // settles, hence the short retry rather than a single attempt.
  function installScanLine() {
    var attempts = 0;
    var timer = setInterval(function () {
      if (addScanLine() || ++attempts > 20) {
        clearInterval(timer);
      }
    }, 50);
  }

  function startScanner() {
    if (closed || delivered || busy) {
      return;
    }
    busy = true;
    lastWidth = reader.clientWidth;
    scanner.start({ facingMode: 'environment' }, config, deliver).then(
      function () {
        busy = false;
        installScanLine();
      },
      function () {
        busy = false;
      }
    );
  }

  // The library measures its container once, when starting, and sizes both the
  // video and the shading overlay from it. It never measures again, so a
  // resized window leaves the two frozen on stale geometry, at different sizes
  // and offsets. Stopping and starting again is the only way to re-measure.
  function restartScanner() {
    if (closed || delivered || busy) {
      return;
    }
    busy = true;
    var resume = function () {
      busy = false;
      startScanner();
    };
    Promise.resolve().then(function () {
      return scanner.stop();
    }).then(resume, resume);
  }

  function hasChannel() {
    return typeof window[CHANNEL] !== 'undefined'
      && typeof window[CHANNEL].postMessage === 'function';
  }

  // Called by the desktop hosts before the scanner goes away, so the camera is
  // released rather than left running.
  function stopScanner() {
    closed = true;
    clearTimeout(resizeTimer);
    try {
      scanner.stop();
    } catch (error) {
      /* already stopped */
    }
  }

  function deliver(decodedText) {
    if (delivered) {
      return;
    }
    delivered = true;
    stopScanner();

    if (hasChannel()) {
      window[CHANNEL].postMessage(decodedText);
      return;
    }

    // The host page is on our own origin, and naming it keeps the code from
    // reaching a parent on another one.
    window.parent.postMessage(decodedText, window.location.origin);
  }

  setScanLineColor(new URLSearchParams(window.location.search).get('line'));
  startScanner();

  // Debounced, and ignoring the sub-pixel noise: dragging a window edge fires
  // continuously, and every restart tears the camera down and back up.
  function onContainerResized() {
    if (Math.abs(reader.clientWidth - lastWidth) < 4) {
      return;
    }
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(restartScanner, 250);
  }

  // Two triggers on purpose. The observer catches a container that changes
  // without the window doing so, a host panel being dragged for instance, and
  // the window event covers the webviews where observing an element is
  // unreliable.
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(onContainerResized).observe(reader);
  }
  window.addEventListener('resize', onContainerResized);
</script>
</body>
</html>
