<!DOCTYPE html>
<html lang="en">
<head>
  <title>Scanner</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* In order to place the tracking correctly */
    canvas.drawing, canvas.drawingBuffer {
      position: absolute;
      left: 0;
      top: 0;
    }
    html, body {
      height: 100%;
      margin: 0;
      /* Any rounding leftover must be cropped, never scrolled: a webview host
         has no business showing scrollbars over a camera. */
      overflow: hidden;
    }
    /* The framing happens here rather than in the host, because the library
       reads `#reader.clientWidth` to size the video and every piece of its
       geometry follows from it. A host that sized the view to one box while
       the page laid out for another got the whole overlay stretched. */
    /* A column: the main axis is vertical, so justify-content centres the
       reader in the window while flex-shrink cannot touch its width. The flex
       stops at the body; #reader keeps the library's own layout inside. */
    body {
      background: var(--ubs-background, #000);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    /* The library draws the scan box of each frame at the size the box is
       laid out, not at the camera's: laid out 640 wide, it decoded 640 pixels
       of a 1280 camera. So #reader is laid out at the decoding width and
       scaled down to the stage for display. A transform leaves the layout
       size the library measures untouched. */
    #stage {
      position: relative;
      flex: none;
      margin: 0 auto;
      overflow: hidden;
    }
    #reader {
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: 0 0;
    }

    /* The sweeping line. It is appended inside #qr-shaded-region, whose
       borders draw the shading, so its content box is exactly the scan square
       and the line needs no geometry of its own. */
    /* Sized against the scale #reader is shown at, so it stays two pixels
       thick on screen. */
    #ubs-scan-line {
      --ubs-line: calc(2px / var(--ubs-scale, 1));
      position: absolute;
      left: 0;
      width: 100%;
      height: var(--ubs-line);
      background: var(--ubs-line-color, #ff6666);
      box-shadow: 0 0 8px 1px var(--ubs-line-color, #ff6666);
      opacity: 0.9;
      animation: ubs-sweep 2s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes ubs-sweep {
      0%   { top: 0; }
      50%  { top: calc(100% - var(--ubs-line)); }
      100% { top: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      #ubs-scan-line { animation: none; top: calc(50% - var(--ubs-line) / 2); }
    }

    /* Shown when the camera never starts. Without it the page is a black
       rectangle and the reason is only in the console. */
    #ubs-message {
      display: none;
      max-width: 34ch;
      margin: 0 auto;
      padding: 0 24px;
      color: #e8e8ea;
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    #ubs-message.shown { display: block; }
    #ubs-message b { display: block; margin-bottom: 6px; font-size: 16px; }
    #ubs-message span { color: #9aa0a8; }

    /* Embedded in a Flutter view: the camera fills the view, cropped rather
       than letterboxed, as the native views do, and Flutter draws the scan
       window over it. */
    .ubs-embedded body { display: block; }
    .ubs-embedded #stage { position: absolute; left: 0; top: 0; margin: 0; }
    .ubs-embedded #qr-shaded-region { display: none !important; }
    .ubs-embedded #ubs-message.shown {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      max-width: none;
      padding: 0 16px;
      box-sizing: border-box;
      font-size: 13px;
    }
  </style>
  <script src="html5-qrcode.min.js"></script>
</head>
<body>
<div id="stage"><div id="reader"></div></div>
<p id="ubs-message"></p>
<script>
// refer doc here https://github.com/mebjas/html5-qrcode

// Scoped rather than global: a top-level `var closed` is `window.closed`, a
// read-only property, and assigning it silently did nothing. The latch that
// was meant to keep a stopped page stopped never held.
(function () {
  'use strict';

  // Desktop hosts register a JavaScript channel under this name; on the web
  // the page answers its parent.
  var CHANNEL = 'UniversalBarcodeScanner';
  var message = document.getElementById('ubs-message');
  var SHADED_REGION_ID = 'qr-shaded-region';
  // The library refuses anything under 50px.
  var MIN_QR_BOX = 60;
  // A code held in front of the camera is read on every frame. It is reported
  // once, and again only after it has been out of sight this long.
  var SAME_CODE_GAP_MS = 1000;

  var F = Html5QrcodeSupportedFormats;
  // Same lists as the native scanners. Null leaves the library's own, which
  // is every format it knows.
  var FORMATS = {
    all: null,
    qr: [F.QR_CODE],
    barcode: [F.CODABAR, F.CODE_39, F.CODE_93, F.CODE_128, F.EAN_13, F.EAN_8,
      F.ITF, F.PDF_417, F.UPC_A, F.UPC_E]
  };

  var reader = document.getElementById('reader');
  var stage = document.getElementById('stage');
  // Widest the scanner is shown, in CSS pixels.
  var MAX_SHOWN = 640;
  // Widths #reader is laid out at, and so decoded at: the camera's, as asked
  // for below, landscape or portrait.
  var DECODE_LANDSCAPE = 1280;
  var DECODE_PORTRAIT = 720;
  // Built on the first configure, and again only when the formats change:
  // the library takes them at construction.
  var scanner = null;
  var scannerFormats = null;

  // Nothing runs until configure: the desktop hosts call it once the page is
  // up, the web host passes the same settings in the query string.
  var settings = {
    continuous: false,
    delay: 0,
    facing: 'environment',
    formats: 'all',
    window: 'square',
    host: 'web',
    // Embedded in a Flutter view, which draws the scan window and passes its
    // size, in CSS pixels of the view.
    embedded: false,
    windowWidth: 0,
    windowHeight: 0
  };
  var stopped = true;
  var delivered = false;
  // An embedded view pauses rather than stops: on the first code when it is
  // not continuous, and when the app asks.
  var paused = false;
  var torchOn = false;
  // The view's size when the camera last started: an embedded view's scan
  // box follows from it.
  var startedWidth = 0;
  var startedHeight = 0;
  // Every code in sight, by value: when it was last read and whether it has
  // been reported since it came into view.
  var sightings = {};
  var lastEmit = null;
  var lastWidth = 0;
  var resizeTimer = null;
  // Starting and stopping the camera are asynchronous and must not overlap.
  var queue = Promise.resolve();

  // No aspectRatio: forcing one overflows the host box. Left out, the video
  // follows the camera's own ratio.
  var config = {
    // Decoding runs on the main thread when the browser has no native
    // detector. Thirty frames a second kept it busy for nothing: a code is
    // read just as fast at twelve.
    fps: 12,
    // Derived from the viewfinder: the library drops the shaded region as soon
    // as the box is taller than the video.
    // The library only decodes inside this box, so a linear barcode gets a
    // wide one rather than a square it may not fit in.
    qrbox: function (viewfinderWidth, viewfinderHeight) {
      if (settings.embedded) {
        // The window Flutter draws, brought back to the scale #reader is
        // laid out at.
        var scale = coverScale(viewfinderWidth, viewfinderHeight);
        return {
          width: Math.min(viewfinderWidth,
            Math.max(MIN_QR_BOX, Math.round(settings.windowWidth / scale))),
          height: Math.min(viewfinderHeight,
            Math.max(MIN_QR_BOX, Math.round(settings.windowHeight / scale)))
        };
      }
      if (settings.window === 'wide') {
        var width = Math.max(MIN_QR_BOX, Math.floor(viewfinderWidth * 0.85));
        var height = Math.max(MIN_QR_BOX, Math.min(
          Math.floor(width * 0.45), Math.floor(viewfinderHeight * 0.85)));
        return {
          width: Math.min(width, viewfinderWidth),
          height: Math.min(height, viewfinderHeight)
        };
      }
      var smallest = Math.min(viewfinderWidth, viewfinderHeight);
      var size = Math.max(MIN_QR_BOX, Math.floor(smallest * 0.7));
      if (size > smallest) {
        size = smallest;
      }
      return { width: size, height: size };
    }
  };

  // The web host passes the colour in the query string, the desktop hosts
  // call this once the page is up.
  function setScanLineColor(css) {
    if (css) {
      document.documentElement.style.setProperty('--ubs-line-color', css);
    }
  }

  // Same for the colour behind the camera.
  function setBackgroundColor(css) {
    if (css) {
      document.documentElement.style.setProperty('--ubs-background', css);
    }
  }

  // Hangs the sweeping line inside the library's own scan region, so it tracks
  // the box when the library shrinks it.
  function addScanLine() {
    var region = document.getElementById(SHADED_REGION_ID);
    if (!region) {
      return false;
    }
    if (document.getElementById('ubs-scan-line')) {
      return true;
    }
    var line = document.createElement('div');
    line.id = 'ubs-scan-line';
    region.appendChild(line);
    return true;
  }

  // The region is not always created before the promise settles, hence the
  // retry.
  function installScanLine() {
    var attempts = 0;
    var timer = setInterval(function () {
      if (addScanLine() || ++attempts > 20) {
        clearInterval(timer);
      }
    }, 50);
  }

  /// What went wrong, in words, rather than a black rectangle.
  function showMessage(error) {
    if (!message) {
      return;
    }
    var name = (error && (error.name || error.code)) || '';
    var text = String((error && error.message) || error || '');
    var title;
    var detail;
    // The wire names of ScannerErrorCode, for an embedded view's onError.
    var code = 'camera_unavailable';

    // A desktop webview has no address bar and nothing to reload: what the
    // user can do there is change the system settings and reopen.
    var desktop = settings.host === 'desktop';
    if (name === 'NotAllowedError' || /permission|denied/i.test(text)) {
      code = 'camera_permission_denied';
      title = 'Camera blocked';
      detail = desktop
        ? 'Allow this application to use the camera in the system settings, '
          + 'then open the scanner again.'
        : 'The page needs permission to use the camera. Allow it in the '
          + 'address bar, then reload.';
    } else if (name === 'NotFoundError' || /no camera|not found/i.test(text)) {
      title = 'No camera found';
      detail = desktop
        ? 'This computer has no camera the scanner can open.'
        : 'This device has no camera the browser can open. Try it on a phone.';
    } else if (name === 'NotReadableError' || /in use|busy/i.test(text)) {
      title = 'Camera busy';
      detail = desktop
        ? 'Another application is using it. Close that one and open the '
          + 'scanner again.'
        : 'Another application is using it. Close that one and reload.';
    } else if (!desktop && !window.isSecureContext) {
      title = 'Not a secure origin';
      detail = 'A browser only opens the camera over HTTPS or on localhost.';
    } else {
      code = 'unknown';
      title = 'The camera did not start';
      detail = text || 'No reason was given.';
    }
    if (settings.embedded) {
      post({ error: { code: code, message: text || name || title } });
    }

    message.innerHTML = '';
    var strong = document.createElement('b');
    strong.textContent = title;
    var span = document.createElement('span');
    span.textContent = detail;
    message.appendChild(strong);
    message.appendChild(span);
    message.className = 'shown';
  }

  function hideMessage() {
    if (message) {
      message.className = '';
    }
  }

  // Runs one camera operation after the previous one has settled.
  function enqueue(task) {
    queue = queue.then(task).catch(function () {
      /* each task reports its own failure */
    });
  }

  function stopCamera() {
    if (!scanner || !scanner.isScanning) {
      return Promise.resolve();
    }
    return scanner.stop().catch(function () {
      /* already stopped */
    });
  }

  function startCamera() {
    if (stopped || delivered) {
      return Promise.resolve();
    }
    if (!scanner || scannerFormats !== settings.formats) {
      if (scanner) {
        try {
          scanner.clear();
        } catch (error) {
          /* nothing drawn yet */
        }
      }
      var options = {
        verbose: false,
        // The browser's own detector where it has one, Chrome on Android and
        // macOS among them: native code instead of JavaScript on every frame.
        experimentalFeatures: { useBarCodeDetectorIfSupported: true }
      };
      if (FORMATS[settings.formats]) {
        options.formatsToSupport = FORMATS[settings.formats];
      }
      scanner = new Html5Qrcode('reader', options);
      scannerFormats = settings.formats;
    }
    layOut();
    // Asked for explicitly: a browser hands out 640x480 when nothing is said,
    // about two pixels per bar for a barcode held at arm's length, where the
    // decoder gives up on the slightest blur. 1280x720 doubles that for a few
    // milliseconds more per frame; 1080p would cost twice as much again.
    // Continuous focus, where the camera has it, keeps a close code sharp.
    var camera = {
      videoConstraints: {
        facingMode: settings.facing,
        width: { ideal: 1280 },
        height: { ideal: 720 },
        advanced: [{ focusMode: 'continuous' }]
      }
    };
    var scanConfig = Object.assign({}, config, camera);
    if (settings.window === 'none') {
      // No box: the library reads the whole frame and shades nothing.
      delete scanConfig.qrbox;
    }
    // A restarted camera comes back with its torch off.
    torchOn = false;
    startedWidth = document.body.clientWidth;
    startedHeight = document.body.clientHeight;
    return Promise.resolve().then(function () {
      return scanner.start({ facingMode: settings.facing }, scanConfig, onDecoded);
    }).then(
      function () {
        hideMessage();
        // Embedded, the scan window is Flutter's.
        if (settings.window !== 'none' && !settings.embedded) {
          installScanLine();
        }
        // Stopped or answered while the camera was opening.
        if (stopped || delivered) {
          return stopCamera();
        }
      },
      showMessage
    );
  }

  // The library measures its container only when starting, so a resized
  // window leaves the video and the overlay on stale geometry.
  function restartScanner() {
    if (stopped || delivered) {
      return;
    }
    enqueue(function () {
      return stopCamera().then(startCamera);
    });
  }

  // Sets the page up and starts the camera. The desktop hosts call it every
  // time they show the page, which they keep loaded between two scans, so it
  // also lifts whatever the previous scan left latched.
  function configure(options) {
    options = options || {};
    setScanLineColor(options.line);
    setBackgroundColor(options.background);
    settings.continuous = options.continuous === true
      || options.continuous === '1';
    settings.delay = Math.max(0, parseInt(options.delay, 10) || 0);
    settings.facing = options.facing === 'user' ? 'user' : 'environment';
    settings.formats = FORMATS.hasOwnProperty(options.formats)
      ? options.formats : 'all';
    settings.window = options.window === 'wide' || options.window === 'none'
      ? options.window : 'square';
    settings.host = options.host === 'desktop' ? 'desktop' : 'web';
    // Set or cleared every time: a kept desktop page may have been a view
    // before and a full page now, or the other way round.
    settings.embedded = options.embedded === true || options.embedded === '1';
    settings.windowWidth = Math.max(0, parseInt(options.windowWidth, 10) || 0);
    settings.windowHeight = Math.max(0, parseInt(options.windowHeight, 10) || 0);
    document.documentElement.classList.toggle('ubs-embedded', settings.embedded);

    stopped = false;
    delivered = false;
    paused = false;
    sightings = {};
    lastEmit = null;
    restartScanner();
  }

  // An embedded view's scan window, when its layout changes it. The library
  // takes the box only when starting, hence the restart.
  function setWindow(width, height) {
    width = Math.max(0, Math.round(width) || 0);
    height = Math.max(0, Math.round(height) || 0);
    if (width === settings.windowWidth && height === settings.windowHeight) {
      return;
    }
    settings.windowWidth = width;
    settings.windowHeight = height;
    scheduleRestart();
  }

  // Debounced: a view being resized changes its size on every frame.
  function scheduleRestart() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (!stopped) {
        restartScanner();
      }
    }, 250);
  }

  // What an embedded view's controller asks for.
  function pauseScanning() {
    paused = true;
  }

  // Every code in sight counts as new again, as on the native views.
  function resumeScanning() {
    paused = false;
    sightings = {};
    lastEmit = null;
  }

  // Answers with the torch's state, which stays off where the camera has no
  // torch the browser lets a page drive, as on most webcams.
  function toggleTorch() {
    var wanted = !torchOn;
    var answer = function (on) {
      torchOn = on;
      post({ torch: on });
    };
    var feature = null;
    try {
      feature = scanner && scanner.isScanning
        ? scanner.getRunningTrackCameraCapabilities().torchFeature()
        : null;
    } catch (error) {
      feature = null;
    }
    if (!feature || !feature.isSupported()) {
      answer(false);
      return;
    }
    feature.apply(wanted).then(
      function () { answer(wanted); },
      function () { answer(torchOn); }
    );
  }

  function hasChannel() {
    return typeof window[CHANNEL] !== 'undefined'
      && typeof window[CHANNEL].postMessage === 'function';
  }

  // Called by the desktop hosts before the scanner goes away, to release the
  // camera.
  function stopScanner() {
    stopped = true;
    clearTimeout(resizeTimer);
    enqueue(stopCamera);
  }

  // Whether a code read on this frame is worth reporting. Each code is
  // followed on its own, so two codes in sight are each reported once rather
  // than alternately. A code the delay held back stays unreported and goes
  // out as soon as the delay allows, if it is still in sight.
  function accept(text, now) {
    for (var key in sightings) {
      if (now - sightings[key].seen >= SAME_CODE_GAP_MS) {
        delete sightings[key];
      }
    }
    var sighting = sightings[text];
    if (!sighting) {
      sighting = sightings[text] = { seen: now, reported: false };
    }
    sighting.seen = now;
    if (sighting.reported) {
      return false;
    }
    if (lastEmit !== null && now - lastEmit < settings.delay) {
      return false;
    }
    sighting.reported = true;
    lastEmit = now;
    return true;
  }

  function onDecoded(text) {
    if (stopped || delivered || paused || !text || !accept(text, Date.now())) {
      return;
    }
    if (!settings.continuous) {
      if (settings.embedded) {
        // The view stays on screen: it waits for resumeScanning.
        paused = true;
      } else {
        delivered = true;
        enqueue(stopCamera);
      }
    }
    post({ code: text });
  }

  // JSON rather than the bare code, so that no code reads as a command.
  function post(message) {
    var data = JSON.stringify(message);
    if (hasChannel()) {
      window[CHANNEL].postMessage(data);
      return;
    }
    // Naming the origin keeps the message from reaching a parent on another
    // one.
    window.parent.postMessage(data, window.location.origin);
  }

  // The page holds the keyboard, so Escape has to be caught here to reach
  // the host.
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') {
      post({ close: true });
    }
  });

  // On the web, the embedded view's controller reaches the page through its
  // parent: only that window, on this origin, and only these calls.
  var CALLS = {
    pauseScanning: function () { pauseScanning(); },
    resumeScanning: function () { resumeScanning(); },
    toggleTorch: function () { toggleTorch(); },
    setWindow: function (data) { setWindow(data.width, data.height); }
  };
  window.addEventListener('message', function (event) {
    if (event.source !== window.parent || event.origin !== window.location.origin) {
      return;
    }
    var data;
    try {
      data = JSON.parse(event.data);
    } catch (error) {
      return;
    }
    if (data && typeof data.call === 'string' && CALLS.hasOwnProperty(data.call)) {
      CALLS[data.call](data);
    }
  });

  var query = new URLSearchParams(window.location.search);
  if (query.has('start')) {
    configure({
      host: query.get('host'),
      line: query.get('line'),
      background: query.get('background'),
      continuous: query.get('continuous'),
      delay: query.get('delay'),
      facing: query.get('facing'),
      formats: query.get('formats'),
      window: query.get('window'),
      embedded: query.get('embedded'),
      windowWidth: query.get('windowWidth'),
      windowHeight: query.get('windowHeight')
    });
    // The embedded view holds its calls back until the page listens.
    if (settings.embedded) {
      post({ ready: true });
    }
  }

  // Embedded, the camera is shown at the view's width, however wide.
  function shownWidth() {
    return settings.embedded
      ? document.body.clientWidth
      : Math.min(document.body.clientWidth, MAX_SHOWN);
  }

  // The scale that makes a frame of this size cover the whole view, cropping
  // what overflows, as the native views' aspect fill does.
  function coverScale(width, height) {
    var body = document.body;
    return Math.max(body.clientWidth / Math.max(1, width),
      body.clientHeight / Math.max(1, height)) || 1;
  }

  // The camera's width, as far as it can be known before it starts. A webcam
  // films in landscape whatever the window's shape; only a phone or a tablet
  // held upright films in portrait. Decoding at less than the shown width
  // would throw pixels away.
  function decodeWidth() {
    var handheld = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    var portrait = handheld && window.innerHeight > window.innerWidth;
    return Math.max(shownWidth(), portrait ? DECODE_PORTRAIT : DECODE_LANDSCAPE);
  }

  // Sets the width #reader is laid out, and decoded, at. Only before a start:
  // the library measures it once.
  function layOut() {
    lastWidth = decodeWidth();
    reader.style.width = lastWidth + 'px';
    fit();
  }

  // Scales #reader to the stage. Cheap, and all a resize needs unless the
  // decoding width itself has to change.
  function fit() {
    if (settings.embedded) {
      fitCover();
      return;
    }
    var shown = shownWidth();
    var scale = shown / Math.max(1, reader.offsetWidth);
    reader.style.transform = 'scale(' + scale + ')';
    reader.style.setProperty('--ubs-scale', String(scale));
    stage.style.width = shown + 'px';
    stage.style.height = Math.round(reader.offsetHeight * scale) + 'px';
  }

  // Embedded: #reader scaled to cover the view and centred in it. Until the
  // video is in, its height is guessed from the camera's usual 16:9.
  function fitCover() {
    var width = document.body.clientWidth;
    var height = document.body.clientHeight;
    var readerWidth = Math.max(1, reader.offsetWidth);
    var readerHeight = reader.offsetHeight > 1
      ? reader.offsetHeight : readerWidth * 9 / 16;
    var scale = coverScale(readerWidth, readerHeight);
    var left = (width - readerWidth * scale) / 2;
    var top = (height - readerHeight * scale) / 2;
    reader.style.transform = 'translate(' + left + 'px, ' + top + 'px) scale('
      + scale + ')';
    reader.style.setProperty('--ubs-scale', String(scale));
    stage.style.width = width + 'px';
    stage.style.height = height + 'px';
  }

  // A restart tears the camera down and back up, so it happens only when the
  // decoding width changes, as when a phone turns, or when an embedded view
  // with a scan window changes size, which changes the box; debounced.
  function onResized() {
    fit();
    if (stopped) {
      return;
    }
    var resized = settings.embedded && settings.window !== 'none'
      && (document.body.clientWidth !== startedWidth
        || document.body.clientHeight !== startedHeight);
    if (!resized && decodeWidth() === lastWidth) {
      return;
    }
    scheduleRestart();
  }

  // #reader grows once the video is in, which changes the stage's height;
  // the body follows the window or the host view.
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(fit).observe(reader);
    new ResizeObserver(onResized).observe(document.body);
  }
  window.addEventListener('resize', onResized);

  // What the hosts call from outside.
  window.configure = configure;
  window.stopScanner = stopScanner;
  window.setWindow = setWindow;
  window.pauseScanning = pauseScanning;
  window.resumeScanning = resumeScanning;
  window.toggleTorch = toggleTorch;
})();
</script>
</body>
</html>
